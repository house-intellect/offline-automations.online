<form
  {{ with .Get "action" }}action="{{ . }}"{{ end }}
  id="{{ with .Get "id" }}{{ . }}{{ else }}contact-form{{ end }}"
  class="bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-gray-200 my-8 max-w-4xl mx-auto"
  name="contact"
  netlify
  netlify-honeypot="you-like-this-field"
>
  <div class="hidden">
    <input name="you-like-this-field" />
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    <div>
      <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Ваше имя / Контактное лицо</label>
      <input
        id="name"
        name="name"
        class="w-full bg-gray-50 border-2 border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 text-base leading-normal focus:outline-none focus:bg-white focus:border-teal-500 focus:ring-4 focus:ring-teal-100 transition-all duration-200 block shadow-sm placeholder-gray-400"
        type="text"
        placeholder="{{ with .Get "placeholder_name" }}{{ . }}{{ else }}Имя / Должность{{ end }}"
        aria-label="Name"
      />
    </div>
    <div>
      <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Корпоративный e-mail <span class="text-teal-600">*</span></label>
      <input
        required
        id="email"
        name="email"
        type="email"
        class="w-full bg-gray-50 border-2 border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 text-base leading-normal focus:outline-none focus:bg-white focus:border-teal-500 focus:ring-4 focus:ring-teal-100 transition-all duration-200 block shadow-sm placeholder-gray-400"
        placeholder="{{ with .Get "placeholder_email" }}{{ . }}{{ else }}email@company.ru{{ end }}"
        aria-label="Email"
      />
    </div>
  </div>
  <div class="mb-6">
    <label for="message" class="block text-sm font-semibold text-gray-700 mb-2">Описание задачи / Объем документов <span class="text-teal-600">*</span></label>
    <textarea
      required
      id="message"
      name="message"
      rows="4"
      placeholder="{{ with .Get "placeholder_message" }}{{ . }}{{ else }}Расскажите о вашей задаче, количестве входящих документов в месяц и учетных системах...{{ end }}"
      class="w-full bg-gray-50 border-2 border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 text-base leading-normal focus:outline-none focus:bg-white focus:border-teal-500 focus:ring-4 focus:ring-teal-100 transition-all duration-200 block resize-y shadow-sm placeholder-gray-400"
    ></textarea>
  </div>
  <div class="text-center pt-2">
    <button
      type="submit"
      class="w-full md:w-auto md:min-w-[280px] rounded-xl px-8 py-4 bg-teal-500 hover:bg-teal-600 active:bg-teal-700 text-white font-bold text-lg leading-tight shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 cursor-pointer inline-flex justify-center items-center gap-2"
    >
      {{ with .Get "button_label" }}{{ . }}{{ else }}Отправить заявку ✉️{{ end }}
    </button>
  </div>
</form>
