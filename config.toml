baseURL = "https://offline-automations.online/"
url = "https://offline-automations.online/"

title = "ДокСинтез — Локальная гибридная система автоматизации финансового контроля"
author = "ДокСинтез"
languageCode = "ru"
DefaultContentLanguage = "ru"
enableInlineShortcodes = true
theme = "tella"
enableRobotsTXT = true
canonifyURLs = true
relativeURLs = false
image = "img/banner.webp"

[params]
  favicon = "favicon.ico"
  showBlog = true
  mainSections = ['blog']
  copyright = "ДокСинтез"
  googleFonts = true

  [params.logo]
    main = "img/logo/logo.png"
    alt = "ДокСинтез — Локальная гибридная система автоматизации документооборота и финансового контроля"
    size = "h-14"

  [params.site]
    name = "ДокСинтез"

  [params.icon]
    fontawesome = true

  [params.homepage_meta_tags]
    meta_description = "ДокСинтез — локальная гибридная система сопоставления первичных документов (УПД, акты) и договоров/заказов (PO) на базе локальных LLM и детерминированного аудита без передачи данных в облако."
    meta_og_description = "Автоматизация финансового контроля и сверки первичных документов. Тандем локальной языковой модели и математического аудита в защищенном контуре предприятия."
    meta_og_type = "website"
    meta_og_url = "https://offline-automations.online/"
    meta_og_image = "img/banner.webp"
    meta_twitter_card = "summary_large_image"
    meta_twitter_site = "@doksintez"
    meta_twitter_creator = "@doksintez"
    meta_og_title = "ДокСинтез — Автоматизация обработки документов и финансового контроля"
    keywords = "ДокСинтез, автоматизация бухгалтерии, сверка УПД, локальная LLM, финансовый контроль, сопоставление первичных документов, распознавание УПД, математическая верификация PO, семантический маппинг, защита коммерческой тайны, обработка PDF, Ollama"

